name: Claude Code

# Thin caller stub for the fleet-standard reusable assistant workflow.
# This file previously inlined its own claude-code-action job pinned to an
# exact SHA, which put it outside the fleet update path: repointing the
# shared tag did nothing for this repo, so every future advisory needed a
# separate manual fix here. See smartwatermelon/github-workflows README,
# "Prefer floating @v3 over an exact pin".
#
# The caller owns the event triggers and the author_association guard; the
# reusable workflow owns the Claude invocation itself.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    # `edited` (not `assigned`) is the actionable event here: the `if:`
    # block below checks `github.event.issue.body` / `.title` for
    # `@claude`, which only changes on edit. Reassignment would fire
    # the workflow without any matching body/title change.
    types: [opened, edited]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # Gate on author_association so only repo owners / members /
    # collaborators (who already have write access) can trigger Claude.
    # This guard MUST stay in the caller — the reusable workflow cannot
    # enforce it, and without it any GitHub user could open an issue
    # containing injected instructions.
    if: |
      (
        github.event_name == 'issue_comment' &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
      ) ||
      (
        github.event_name == 'pull_request_review_comment' &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
      ) ||
      (
        github.event_name == 'pull_request_review' &&
        contains(github.event.review.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)
      ) ||
      (
        github.event_name == 'issues' &&
        (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)
      )
    permissions:
      contents: read
      issues: read
      pull-requests: read
      id-token: write # required by claude-code-action for internal authentication
    # Floating @v3, not an exact @v3.x.y pin. Exact pins are immutable and
    # are exactly what left ~19 fleet repos stranded on a pre-GHSA-8q5r-mmjf-575q
    # action build; a floating tag lets one repoint upstream reach every
    # caller. The v1 line is frozen/deprecated — v3 is the current track for
    # claude-assistant.yml as well.
    uses: smartwatermelon/github-workflows/.github/workflows/claude-assistant.yml@v3
    secrets:
      claude_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

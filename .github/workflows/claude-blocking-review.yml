name: Claude Blocking Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  # Pin to v3.1.0 or later, not a caller-level `if: github.actor !=
  # 'dependabot[bot]'` gate. A job-level `if:` that evaluates false means
  # this job never dispatches, so a required status check on it never
  # reports — it stays permanently pending on Dependabot PRs under branch
  # protection that requires the check, blocking auto-merge entirely.
  # v3.1.0+ instead skips Dependabot PRs from INSIDE the job, so the job
  # still runs and reports a real PASS. See
  # smartwatermelon/github-workflows#115/#117.
  claude-review:
    uses: smartwatermelon/github-workflows/.github/workflows/claude-blocking-review.yml@v3.1.1
    with:
      pr_number: ${{ github.event.pull_request.number }}
      # Repo-specific review criteria carried over from the previous
      # inlined claude-code-review.yml workflow. The generic review policy
      # (BLOCK on bugs / reliability regressions / security / async-error /
      # data-loss) lives in the reusable workflow; only the criteria
      # unique to this repo belong here.
      extra_instructions: |
        This repo is claude-agents — a multi-harness agentic plugin
        marketplace (Claude Code, Codex CLI, Cursor, OpenCode, Gemini CLI).
        The source of truth is Markdown under `plugins/`; per-harness
        artifacts under `.codex/`, `.cursor-plugin/`, `.cursor/rules/`,
        `.opencode/`, and the top-level `skills/`/`agents/`/`commands/`
        directories are generated by `make generate HARNESS=<name>` and are
        gitignored.

        Read `AGENTS.md` at the repo root (canonical context) before
        starting. Consult `docs/authoring.md` for plugin / agent / skill
        frontmatter shapes, `docs/harnesses.md` for per-harness capability
        deltas, and `docs/plugins.md` for the catalog.

        Repo-specific concerns to weigh:

        1. Source-of-truth invariant — Only `plugins/`,
           `.claude-plugin/marketplace.json`, `docs/`, `tools/`, and
           top-level Markdown (`AGENTS.md`, `CLAUDE.md`, `GEMINI.md`,
           `README.md`, `ARCHITECTURE.md`, `CONTRIBUTING.md`) should be
           hand-edited. Hand-committed changes under `.codex/`,
           `.cursor-plugin/`, `.cursor/rules/`, `.opencode/`, or top-level
           `skills/`/`agents/`/`commands/` are generated artifacts and are
           a real defect, not a style nit.

        2. Plugin / agent / skill frontmatter — Every agent under
           `plugins/*/agents/*.md` needs `name:`, `description:`, and a
           `model:` tier. Every skill under `plugins/*/skills/*/SKILL.md`
           needs `name:` and `description:`. Plugin directory names must be
           lowercase, hyphen-separated, and must NOT contain `__` (that is
           the adapter namespace separator — see `docs/authoring.md`).

        3. Cross-harness portability — Content should work across all five
           harnesses unless explicitly marked Claude-Code-only in
           `CLAUDE.md`. Watch for hard dependencies on Claude-Code-only
           primitives (`TodoWrite`, the `Task` / `Agent` spawn tool,
           per-agent `tools:` frontmatter) without a documented fallback.
           Locked agents (`tools: []`) get special-cased by the OpenCode
           adapter — breaking that contract is a reliability regression.

        4. Codex 8 KB skill body cap — Skill bodies in
           `plugins/*/skills/*/SKILL.md` should fit under ~8 KB after
           adapter transpilation; overflow belongs in
           `references/details.md`. `make garden` flags oversize skills.

        5. Canonical context sync — `AGENTS.md` is the single source of
           truth; `CLAUDE.md` imports it via `@AGENTS.md` and `GEMINI.md`
           mirrors it. Call out divergence among the three. `AGENTS.md`
           must stay under ~150 lines — detail belongs in `docs/`.

        6. Quality gates — Will this break `make validate STRICT=1`,
           `make garden`, `make test`, or `make smoke-test`? Reference the
           relevant gate by name so the author knows what to run.

        7. Catalog drift — New, removed, or renamed plugins, agents,
           skills, or commands should be reflected in `docs/plugins.md`,
           `docs/agents.md`, and `docs/agent-skills.md` counts and lists.
           The plugin total in `AGENTS.md` and `README.md` should also stay
           in sync.

        8. Python tooling correctness — Code under `tools/` uses uv + ruff
           + ty (NOT pip / mypy / black). Flag reintroduction of `pip`,
           `requirements.txt`, `mypy`, or `black`. Watch for unhandled
           errors in adapter code, broken JSON in `plugin.json` or
           `marketplace.json`, and missing tests under `tools/tests/`.

        9. Security — No secrets in code or workflow files; no destructive
           git in scripts (`push --force`, `reset --hard`, `branch -D`); no
           shell injection in `Bash(...)` allowlists or hook scripts;
           pinned action SHAs and `persist-credentials: false` on any new
           GitHub workflow.

        Do NOT comment on formatting, import order, or naming style —
        `ruff` and `ty` handle that. Do NOT re-raise issues already flagged
        by `coderabbitai` or `chatgpt-codex-connector` in this PR's
        existing comments.
    secrets:
      claude_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
